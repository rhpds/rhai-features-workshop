{{- if and .Values.admin.enabled .Values.admin.openshiftAi.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-openshift-ai
  namespace: {{ .Values.bootstrap.argoNamespace }}
  annotations:
    # Wave -4: after the operator, before admin-dashboard-config (-1) which
    # patches the OdhDashboardConfig that the dashboard component creates.
    argocd.argoproj.io/sync-wave: "-4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.bootstrap.project }}
  destination:
    name: in-cluster
    namespace: redhat-ods-operator
  source:
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    path: {{ include "bootstrap.path" (dict "ctx" . "chart" "admin/openshift-ai") }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      # The DSC/DSCI CRDs only appear once the operator has installed.
      - SkipDryRunOnMissingResource=true
      # The operator defaults many fields in the DSC -- adopt rather than fight.
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        maxDuration: 5m
        factor: 2
{{- end }}
