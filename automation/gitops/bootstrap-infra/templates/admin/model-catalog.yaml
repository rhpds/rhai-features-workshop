{{- if and .Values.admin.enabled .Values.admin.modelCatalog.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-model-catalog
  namespace: {{ .Values.bootstrap.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.bootstrap.project }}
  destination:
    name: in-cluster
    namespace: rhoai-model-registries
  source:
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    path: {{ include "bootstrap.path" (dict "ctx" . "chart" "admin/model-catalog") }}
    helm:
      valuesObject:
        # Needed by templates/catalog-user-rbac.yaml, which binds the model
        # catalog reader Role to user1..userN by name.
        user:
          count: {{ .Values.user.count }}
          prefix: {{ .Values.user.prefix | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # RHOAI CRDs may not exist yet when this first syncs.
      - SkipDryRunOnMissingResource=true
      - CreateNamespace=true
    retry:
      limit: 20
      backoff:
        duration: 20s
        maxDuration: 5m
        factor: 2
{{- end }}
