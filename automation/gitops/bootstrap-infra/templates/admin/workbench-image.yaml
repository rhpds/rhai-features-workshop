{{- if and .Values.admin.enabled .Values.admin.workbenchImage.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-workbench-image
  namespace: {{ .Values.bootstrap.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.bootstrap.project }}
  destination:
    name: in-cluster
    namespace: redhat-ods-applications
  source:
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    path: {{ include "bootstrap.path" (dict "ctx" . "chart" "admin/workbench-image") }}
    helm:
      valuesObject:
        imagePuller:
          # Needs the che.eclipse.org KubernetesImagePuller CRD, which nothing in
          # this chart installs -- see deployments/admin/workbench-image/values.yaml.
          enabled: {{ .Values.admin.workbenchImage.imagePuller }}
  ignoreDifferences:
    # The image controller rewrites tag metadata after import.
    - group: image.openshift.io
      kind: ImageStream
      jsonPointers:
        - /spec/tags
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # RHOAI CRDs may not exist yet when this first syncs.
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 20
      backoff:
        duration: 20s
        maxDuration: 5m
        factor: 2
{{- end }}
