{{- if and .Values.users.enabled .Values.users.automl.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: user-automl
  namespace: {{ .Values.bootstrap.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  generators:
    - list:
        elements:
{{- include "bootstrap.userElements" . }}
  template:
    metadata:
      name: automl-{{ `{{ user }}` }}
      namespace: {{ .Values.bootstrap.argoNamespace }}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: {{ .Values.bootstrap.project }}
      source:
        repoURL: {{ .Values.bootstrap.repoURL }}
        targetRevision: {{ .Values.bootstrap.targetRevision }}
        path: {{ include "bootstrap.path" (dict "ctx" . "chart" "user/automl") }}
        helm:
          values: |
            username: {{ `{{ user }}` }}
            namespacePrefix: {{ .Values.user.namespacePrefix }}
      destination:
        name: in-cluster
        namespace: {{ .Values.user.namespacePrefix }}-{{ `{{ user }}` }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # CRDs from the DataScienceCluster may not exist yet on first sync.
          - SkipDryRunOnMissingResource=true
          # The training-data ConfigMap holds a ~310KB CSV. Client-side apply
          # copies the whole object into the last-applied-configuration
          # annotation, which cannot exceed 262144 bytes, so the ConfigMap is
          # rejected and the bucket Job hangs on the missing volume. Server-side
          # apply does not use that annotation.
          - ServerSideApply=true
        retry:
          limit: 20
          backoff:
            duration: 20s
            maxDuration: 5m
            factor: 2
{{- end }}
