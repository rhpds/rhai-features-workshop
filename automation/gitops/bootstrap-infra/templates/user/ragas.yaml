{{- if and .Values.users.enabled .Values.users.ragas.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: user-ragas
  namespace: {{ .Values.bootstrap.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  generators:
    - list:
        elements:
{{- include "bootstrap.userElements" . }}
  template:
    metadata:
      name: ragas-{{ `{{ user }}` }}
      namespace: {{ .Values.bootstrap.argoNamespace }}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: {{ .Values.bootstrap.project }}
      source:
        repoURL: {{ .Values.bootstrap.repoURL }}
        targetRevision: {{ .Values.bootstrap.targetRevision }}
        path: {{ include "bootstrap.path" (dict "ctx" . "chart" "user/ragas") }}
        helm:
          values: |
            username: {{ `{{ user }}` }}
            namespacePrefix: {{ .Values.user.namespacePrefix }}
      destination:
        name: in-cluster
        namespace: {{ .Values.user.namespacePrefix }}-{{ `{{ user }}` }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 20
          backoff:
            duration: 20s
            maxDuration: 5m
            factor: 2
{{- end }}
