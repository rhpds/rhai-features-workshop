{{- if and .Values.users.enabled .Values.users.mortgageAi.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: user-mortgage-ai
  namespace: {{ .Values.bootstrap.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  generators:
    - list:
        elements:
{{- include "bootstrap.userElements" . }}
  template:
    metadata:
      name: mortgage-ai-{{ `{{ user }}` }}
      namespace: {{ .Values.bootstrap.argoNamespace }}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: {{ .Values.bootstrap.project }}
      source:
        repoURL: {{ .Values.bootstrap.repoURL }}
        targetRevision: {{ .Values.bootstrap.targetRevision }}
        # Reuses the chart shipped at the repo root, same as the standalone install.
        path: {{ .Values.users.mortgageAi.chartPath }}
        helm:
          values: |
            secrets:
              AUTH_DISABLED: "true"
              COMPANY_NAME: "Fed Aura Capital"
              # S3 -- per-user MinIO from the user/minio chart
              S3_ENDPOINT: "http://minio-service:9000"
              S3_ACCESS_KEY: "{{ .Values.minio.rootUser }}"
              S3_SECRET_KEY: "{{ .Values.minio.rootPassword }}"
              # LLM -- injected MaaS endpoint
              LLM_BASE_URL: "{{ .Values.remotellm.url }}"
              LLM_API_KEY: "{{ .Values.remotellm.apiToken }}"
              LLM_MODEL: "{{ .Values.remotellm.id }}"
              # Shared MCP risk server from the admin/mcp chart
              MCP_RISK_SERVER_URL: "http://mcp-risk-server.mcp-servers.svc.cluster.local:8081/mcp"
              # MLflow -- in-cluster RHOAI MLflow, authenticated with the pod's
              # ServiceAccount token (no manually minted token needed).
              # The RHOAI MLflow server is served under a /mlflow path prefix. Without
              # it the client's workspace probe (/api/3.0/mlflow/server-info) 404s, the
              # client concludes the server has no workspace support, and every call
              # fails - either "Workspace context is required for this request" or
              # "Active workspace cannot be used because the remote server does not
              # support workspaces".
              MLFLOW_TRACKING_URI: "https://mlflow.redhat-ods-applications.svc.cluster.local:8443/mlflow"
              # MLFLOW_TRACKING_AUTH is deliberately unset: "kubernetes" is not a
              # registered request-auth provider in the mortgage-ai image (verified on
              # 1.0.2 and 1.0.3), so it silently added no Authorization header and the
              # server answered 401. The token below is what actually authenticates.
              MLFLOW_EXPERIMENT_NAME: "mortgage-ai"
              MLFLOW_WORKSPACE: "{{ .Values.user.namespacePrefix }}-{{ `{{ user }}` }}"
              MLFLOW_TRACKING_INSECURE_TLS: "true"
            # NeMo Guardrails. The API logs "Safety shields: DEGRADED
            # (NEMO_GUARDRAILS_ENDPOINT not set, shields disabled)" when this is off,
            # and module 5.2 has nothing to exercise. The chart wires
            # NEMO_GUARDRAILS_ENDPOINT to the in-namespace service automatically.
            nemoGuardrails:
              enabled: {{ .Values.users.mortgageAi.guardrails.enabled }}
              # The NemoGuard 8B detector needs a GPU (nvidia.com/mig-2g.35gb) and an
              # S3 bucket holding the model weights, neither of which this workshop
              # provisions - the GPU machineset is deliberately at 0 replicas. The
              # content_safety flows and prompts are gated on this flag, so with it off
              # the rails still run: regex input/output detection, sensitive-data
              # detection (SSN, credit card, email, phone) and the competitor policy,
              # all judged by the same model the agents use.
              contentSafety:
                deploy: {{ .Values.users.mortgageAi.guardrails.contentSafety }}
              # The nginx hop only exists to rewrite paths for MaaS deployments that
              # serve a model under a prefix. The injected endpoint is already an
              # OpenAI-compatible base URL ending in /v1, so NeMo can talk to it
              # directly and an unconfigured proxy would just break the rails.
              proxy:
                enabled: {{ .Values.users.mortgageAi.guardrails.proxy }}
            # Components provided by other charts in this repo
            keycloak:
              enabled: false
            minio:
              enabled: false
            mcpRiskServer:
              enabled: false
            mcpWeatherServer:
              enabled: false
            routes:
              sharedHost: "mortgage-ai-{{ .Values.user.namespacePrefix }}-{{ `{{ user }}` }}.{{ .Values.deployer.domain }}"
            seed:
              enabled: {{ .Values.users.mortgageAi.seed }}
            ui:
              image:
                tag: "{{ .Values.users.mortgageAi.uiImageTag }}"
            mlflow:
              rbac:
                enabled: true
                pipelineRunner:
                  enabled: true
      destination:
        name: in-cluster
        namespace: {{ .Values.user.namespacePrefix }}-{{ `{{ user }}` }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # CRDs from the DataScienceCluster may not exist yet on first sync.
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 20
          backoff:
            duration: 20s
            maxDuration: 5m
            factor: 2
{{- end }}
