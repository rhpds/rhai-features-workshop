# Default values for the bootstrap-infra chart (ArgoCD app-of-apps parent).
#
# This chart only creates ArgoCD Applications / ApplicationSets; the actual
# workload charts live under <pathPrefix>/deployments/{admin,user}/*.
#
#   admin.*  global, cluster-wide infrastructure -- one Application each
#   users.*  per-user resources -- one ApplicationSet each, fanned out over
#            user1..userN into namespace <namespacePrefix>-<user>
#
# Ordering is handled by sync waves, so a single apply converges. The two groups
# can also be driven independently from CI with the admin.enabled /
# users.enabled switches (see gitops/README.md).
#
# Values marked "injected" are overridden per environment from
# agd_v2/rhai-features-workshop/common.yaml.

bootstrap:
  # Git repository holding this chart and the deployments/ charts.
  repoURL: https://github.com/rhpds/rhai-features-workshop
  # Branch, tag or commit to track.
  targetRevision: main
  # Path inside the repo that contains bootstrap-infra/ and deployments/.
  pathPrefix: automation/gitops
  argoNamespace: openshift-gitops
  project: default

# Cluster coordinates (injected). deployer.domain builds the mortgage-ai routes.
deployer:
  apiUrl: https://api.cluster-guid.sandbox.opentlc.com:6443
  domain: apps.cluster-guid.sandbox.opentlc.com

# Workshop users -> namespaces wksp-user1 .. wksp-userN (injected).
user:
  count: 30
  prefix: user
  namespacePrefix: wksp

# Remote LLM / MaaS credentials (injected).
# Consumed by admin/maas, user/workspace, user/ogx and user/mortgage-ai.
# The model and endpoint are decided at staging time, so nothing is baked in
# here -- all four values must be injected.
remotellm:
  enabled: true
  # OpenAI-compatible base URL, including /v1.
  url: ""
  # Hostname only, no scheme and no path -- ExternalProvider rejects those.
  endpoint: ""
  # Model id as served by the endpoint.
  id: ""
  apiToken: ""

# Shared MinIO credentials for the per-user object store (injected).
minio:
  rootUser: minio
  rootPassword: "paste-your-password-here"

# ---------------------------------------------------------------------------
# Global / admin infrastructure -- applied once, before any user exists.
# Set admin.enabled=false to skip the whole group.
# ---------------------------------------------------------------------------
admin:
  enabled: true
  # Red Hat OpenShift AI operator subscription (wave -5). Everything else in this
  # chart creates RHOAI custom resources, so without this nothing can sync.
  openshiftAiOperator:
    enabled: true
    # RHOAI 3.5 is required: it provides the ogx, mlflowoperator, aigateway and
    # mcplifecycleoperator DSC components the workshop modules depend on.
    channel: stable-3.5
    # Pin a CSV (e.g. rhods-operator.3.5.0) for a reproducible event; empty
    # tracks the channel.
    startingCSV: ""
  # Red Hat Agent Sandbox operator (wave -5). Provides sandboxes.agents.x-k8s.io,
  # which the OpenShell gateway and sandbox charts (users.openshell) require. It was
  # only ever installed by hand from templates/user/openshell/common.sh, so a fresh
  # cluster failed module 5.3's preflight.
  agentSandboxOperator:
    enabled: true
    channel: preview-0.9
    startingCSV: ""

  # DSCInitialization + DataScienceCluster (wave -4). Component list lives in
  # deployments/admin/openshift-ai/values.yaml.
  openshiftAi:
    enabled: true
  # MaaS platform install (wave -3). Runs setup-maas.sh from the upstream
  # rhoai-maas-guide as a Job: operator subscriptions, Kuadrant, UWM,
  # GatewayClass + Gateway, PostgreSQL, Authorino TLS and maas-api. Required
  # before admin/maas (wave 1) can create any maas.opendatahub.io resource.
  maasInstall:
    enabled: true
    # Pinned upstream release. Bumping it re-runs the installer Job.
    guideRef: rhoai3.5
    rhoaiVersion: "3.5"
    # Empty lets the script default the gateway to maas.<cluster-domain>.
    hostname: ""
    withObservability: false
  # RHOAI dashboard feature flags (wave -1).
  dashboardConfig:
    enabled: true
  # MLflow tracking server, cluster-scoped CR (wave 0).
  mlflow:
    enabled: true
  # Shared risk + weather MCP servers (wave 0).
  mcp:
    enabled: true
  # Custom code-server ImageStream (wave 0).
  workbenchImage:
    enabled: true
    # Pre-pull the image on every node. Requires the che.eclipse.org
    # KubernetesImagePuller CRD (DevWorkspace/Che operator), which neither this
    # chart nor RHOAI installs, so it is off by default -- with it on and the CRD
    # missing, the Application cannot sync at all and the ImageStream is lost too.
    imagePuller: false
  # Custom CPU model catalog, serving runtime template, llm-d configs (wave 1).
  modelCatalog:
    enabled: true
  # Models-as-a-Service wiring for the upstream endpoint (wave 1).
  maas:
    enabled: true
  # Inference gateway + in-cluster TinyLlama (wave 2). Requires cert-manager and
  # the 'cert-manager-ingress-cert' secret in openshift-ingress, so it is opt-in.
  # When enabled, user/ogx automatically registers the in-cluster endpoint as a
  # second inference provider.
  llmd:
    enabled: false
  # EvalHub (TrustyAI) evaluation stack (wave 3).
  evalhub:
    enabled: true

# ---------------------------------------------------------------------------
# Per-user resources -- applied once the user count is known.
# Set users.enabled=false to provision only the global infrastructure.
# ---------------------------------------------------------------------------
users:
  enabled: true
  # Namespace + injected LLM credentials (wave 5). Required by everything below.
  workspace:
    enabled: true
  # Object store + RHOAI data connections (wave 6).
  minio:
    enabled: true
  # Data Science Pipelines (wave 7).
  dspa:
    enabled: true
  # AutoML training bucket + dataset upload (wave 7).
  automl:
    enabled: true
  # vLLM CPU model serving per user (wave 7). One pod per enabled model per user
  # (4-8 cores, 8-16Gi each) -- keep off unless the cluster is sized for it.
  modelCatalog:
    enabled: false
  # OGX / llama-stack playground + PGVector (wave 8).
  ogx:
    enabled: true
  # OpenShell agent sandboxing for module 5.3 (waves 9 and 10).
  #
  # Ported from the content repo's gitops/ tree, which ArgoCD never reads - RHDP
  # syncs this tree, so the charts had to live here to run at all.
  #
  # Requires the Agent Sandbox operator: admin/agent-sandbox-operator installs it,
  # since the gateway chart depends on the CRDs and fails preflight without them.
  openshell:
    enabled: false
    # Name of the demo sandbox the provisioning Job creates.
    sandboxName: fedaura-opencode

  # Multi-agent mortgage application (wave 9).
  mortgageAi:
    enabled: true
    # NeMo Guardrails (module 5.2). Requires the trustyai DSC component for the
    # NemoGuardrails CRD, which admin/openshift-ai enables.
    guardrails:
      enabled: true
      # NemoGuard 8B content-safety detector. Needs a GPU and S3-hosted weights,
      # so it stays off; the regex, sensitive-data and competitor rails do not.
      contentSafety: false
      # nginx path-rewriting hop, only needed for prefixed MaaS deployments.
      proxy: false
    # Vendored chart, shared with the standalone install.
    chartPath: automation/gitops/deployments/mortgage-ai
    uiImageTag: "latest"
    seed: true
