# Red Hat OpenShift AI operator subscription.
#
# Only the operator is installed here. The DSCInitialization and
# DataScienceCluster live in the sibling `openshift-ai` chart so the component
# list can be changed without touching the subscription.
operator:
  namespace: redhat-ods-operator
  # RHOAI 3.5 provides the ogx, mlflowoperator, aigateway and
  # mcplifecycleoperator DSC components this workshop depends on.
  channel: stable-3.5
  name: rhods-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  # Pin to a specific CSV, e.g. rhods-operator.3.5.0. Empty tracks the channel.
  startingCSV: ""
  operatorGroup:
    enabled: true
