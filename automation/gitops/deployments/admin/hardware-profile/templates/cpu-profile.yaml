---
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  annotations:
    opendatahub.io/description: CPU profile with configurable CPU and memory.
    opendatahub.io/disabled: 'false'
    opendatahub.io/display-name: CPU Profile
  name: cpu-profile
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: hardwareprofile
    app.opendatahub.io/hardwareprofile: 'true'
spec:
  identifiers:
    - defaultCount: '2'
      displayName: CPU
      identifier: cpu
      minCount: 1
      maxCount: 4
      resourceType: CPU
    - defaultCount: 8Gi
      displayName: Memory
      identifier: memory
      minCount: 1Gi
      maxCount: 16Gi
      resourceType: Memory
