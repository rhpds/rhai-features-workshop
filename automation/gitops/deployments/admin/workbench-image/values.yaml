image:
  repository: quay.io/rh-aiservices-bu/fedaura-codeserver
  tag: "1.3"
# Pre-pulls the workbench image onto every node so the first workbench start is
# fast. Off by default: KubernetesImagePuller is a che.eclipse.org CRD provided by
# the DevWorkspace/Che operator, which RHOAI does not install - the workbenches DSC
# component does not bring it either. With it on and the CRD absent, the whole
# Application fails to sync ("one or more synchronization tasks are not valid") and
# the ImageStream never lands either, which is what happened on a dev order.
#
# Enable it only on clusters that have the CRD:
#   oc get crd kubernetesimagepullers.che.eclipse.org
imagePuller:
  enabled: false
  # The puller warms a different tag than the ImageStream on purpose in the
  # source templates; keep it configurable.
  tag: "1.0"
  namespace: openshift-operators
  cachingIntervalHours: "1"
  cachingMemoryRequest: "10Mi"
  cachingMemoryLimit: "20Mi"
