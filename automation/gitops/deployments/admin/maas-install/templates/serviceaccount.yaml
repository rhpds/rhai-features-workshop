apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-install
  namespace: {{ .Release.Namespace }}
---
# The script installs operators, creates a GatewayClass and reads/writes RHOAI
# config, so it needs cluster-admin. It runs once at provision time and is not a
# long-lived workload.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maas-install-cluster-admin
subjects:
  - kind: ServiceAccount
    name: maas-install
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
