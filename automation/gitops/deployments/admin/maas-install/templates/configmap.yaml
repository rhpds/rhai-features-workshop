apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-install-runner-{{ include "maasInstall.refSlug" . }}
  namespace: {{ .Release.Namespace }}
data:
  # Minimal envsubst replacement: the oc CLI image has no gettext, and the
  # script calls `envsubst '${A} ${B}' < tmpl`. Only the variables named in the
  # shell-format argument are substituted, matching envsubst's behaviour.
  envsubst.py: |
    #!/usr/bin/env python3
    import os, re, sys
    fmt = sys.argv[1] if len(sys.argv) > 1 else None
    data = sys.stdin.read()
    names = re.findall(r'\$\{(\w+)\}', fmt) if fmt else sorted(
        set(re.findall(r'\$\{(\w+)\}', data)))
    for n in names:
        data = data.replace('${' + n + '}', os.environ.get(n, ''))
    sys.stdout.write(data)
  run.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    REPO="{{ .Values.guide.repo }}"
    REF="{{ .Values.guide.ref }}"
    WORKDIR="$(mktemp -d)"

    # envsubst shim on PATH (no gettext in the oc image).
    mkdir -p "$WORKDIR/bin"
    install -m 0755 /runner/envsubst.py "$WORKDIR/bin/envsubst"
    export PATH="$WORKDIR/bin:$PATH"

    echo "Fetching ${REPO} @ ${REF}"
    # No git in the image, so use the release tarball.
    curl -sSfL "${REPO}/archive/refs/tags/${REF}.tar.gz" -o "$WORKDIR/guide.tar.gz"
    mkdir -p "$WORKDIR/guide"
    tar -xzf "$WORKDIR/guide.tar.gz" -C "$WORKDIR/guide" --strip-components=1
    cd "$WORKDIR/guide"
    chmod +x scripts/*.sh manifests/*/*.sh 2>/dev/null || true

    # The installer's RHOAI-configuration phase applies its own DataScienceCluster,
    # DSCInitialization and OdhDashboardConfig. It skips that phase only when the
    # DSC already reports aigateway.modelsAsAService=Managed, which admin/openshift-ai
    # sets. Sync waves alone are not enough: admin/openshift-ai cannot create the DSC
    # until the RHOAI CRDs exist, so it can still be Missing when this Job starts.
    # Wait for the contract to hold before running, otherwise the script and ArgoCD
    # both end up owning the DSC.
    if [ "${WAIT_FOR_DSC:-true}" = "true" ]; then
      echo "Waiting for DSC aigateway.modelsAsAService=Managed (timeout ${DSC_WAIT_TIMEOUT:-1800}s)"
      _deadline=$(( $(date +%s) + ${DSC_WAIT_TIMEOUT:-1800} ))
      while :; do
        _state=$(oc get datasciencecluster default-dsc \
          -o jsonpath='{.spec.components.aigateway.modelsAsAService.managementState}' 2>/dev/null || true)
        if [ "${_state}" = "Managed" ]; then
          echo "DSC reports modelsAsAService=Managed - the installer will skip its RHOAI phase"
          break
        fi
        if [ "$(date +%s)" -ge "${_deadline}" ]; then
          echo "WARNING: timed out waiting for the DSC. Continuing anyway; the installer"
          echo "WARNING: will apply its own DSC and ArgoCD will reconcile it afterwards."
          break
        fi
        sleep 10
      done
    fi

    echo "Running setup-maas.sh $*"
    exec ./scripts/setup-maas.sh "$@"
