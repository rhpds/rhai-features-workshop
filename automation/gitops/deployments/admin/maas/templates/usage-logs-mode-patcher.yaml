{{- if .Values.usageLogsPatcher.enabled }}
# RHOAI 3.5.x bootstrap race: the maas-controller can create the usage-logs
# OpenTelemetryCollector seconds before the OTel operator's defaulting webhook is
# registered, so spec.mode is stored empty. Every later reconcile is then denied
# ("mode is set to , which does not support modification"), so no collector runs,
# the gateway's OTLP access logs never reach Loki, and the usage dashboards
# (including the only user-scoped one, dashboard-5-maas-usage-logs) are never
# created - a non-admin sees an empty Observe & monitor dashboard.
#
# Deleting the CR is enough to recover: the controller applies it without a mode,
# so once the defaulting webhook exists it sets mode=deployment and the apply
# succeeds. Letting the controller recreate it also keeps its ownerReferences.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patch-usage-logs-mode
  namespace: {{ .Values.usageLogsPatcher.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patch-usage-logs-mode
  namespace: {{ .Values.usageLogsPatcher.namespace }}
rules:
  - apiGroups: ["opentelemetry.io"]
    resources: ["opentelemetrycollectors"]
    verbs: ["get", "list", "watch", "delete"]
  # Used only to confirm the collector Deployment appears once mode is set.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patch-usage-logs-mode
  namespace: {{ .Values.usageLogsPatcher.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: patch-usage-logs-mode
subjects:
  - kind: ServiceAccount
    name: patch-usage-logs-mode
    namespace: {{ .Values.usageLogsPatcher.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: patch-usage-logs-mode-v{{ .Values.usageLogsPatcher.version }}
  namespace: {{ .Values.usageLogsPatcher.namespace }}
  annotations:
    # After admin/maas (wave 1) has created the Config that makes the
    # maas-controller create the collector in the first place.
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: patch-usage-logs-mode
      restartPolicy: Never
      containers:
        - name: patch
          image: {{ .Values.usageLogsPatcher.image }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              NS={{ .Values.usageLogsPatcher.namespace }}
              CR=usage-logs

              echo "Waiting for OpenTelemetryCollector $NS/$CR..."
              for i in $(seq 1 60); do
                if oc get opentelemetrycollector "$CR" -n "$NS" >/dev/null 2>/tmp/get.err; then
                  break
                fi
                echo "  attempt $i/60 - not there yet ($(tr -d '\n' < /tmp/get.err)), sleeping 10s..."
                sleep 10
              done

              if ! oc get opentelemetrycollector "$CR" -n "$NS" >/dev/null 2>/tmp/get.err; then
                echo "ERROR: $CR not readable after 10 minutes: $(cat /tmp/get.err)"
                echo "Is usageLogging enabled on the MaaS Config?"
                exit 1
              fi

              MODE=$(oc get opentelemetrycollector "$CR" -n "$NS" -o jsonpath='{.spec.mode}')
              if [ -n "$MODE" ]; then
                echo "spec.mode is already '$MODE' - nothing to do."
                exit 0
              fi

              echo "spec.mode is empty. Deleting $CR so the controller recreates it."
              oc delete opentelemetrycollector "$CR" -n "$NS" --wait=true

              echo "Waiting for the maas-controller to recreate it with a mode..."
              NEW_MODE=""
              for i in $(seq 1 30); do
                NEW_MODE=$(oc get opentelemetrycollector "$CR" -n "$NS" -o jsonpath='{.spec.mode}' 2>/dev/null || true)
                if [ -n "$NEW_MODE" ]; then
                  break
                fi
                echo "  attempt $i/30 - not recreated yet, sleeping 10s..."
                sleep 10
              done

              if [ -z "$NEW_MODE" ]; then
                echo "ERROR: $CR was not recreated with a mode within 5 minutes."
                echo "Check the maas-controller logs in redhat-ods-applications."
                exit 1
              fi
              echo "spec.mode is now '$NEW_MODE'."

              echo "Waiting for the collector Deployment to appear..."
              for i in $(seq 1 30); do
                if oc get deployment "$CR-collector" -n "$NS" >/dev/null 2>&1; then
                  echo "Deployment $CR-collector created. Usage logs will now reach Loki."
                  exit 0
                fi
                echo "  attempt $i/30 - not there yet, sleeping 10s..."
                sleep 10
              done

              echo "ERROR: $CR-collector Deployment was not created after 5 minutes"
              exit 1
{{- end }}
