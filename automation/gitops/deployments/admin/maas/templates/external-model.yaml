---
# API key for the external provider -- injected, never committed.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.model.name }}-api-key
  namespace: {{ .Values.namespaces.externalModels }}
  labels:
    inference.llm-d.ai/ipp-managed: "true"
    inference.networking.k8s.io/bbr-managed: "true"
type: Opaque
stringData:
  api-key: {{ .Values.model.apiKey | quote }}
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalProvider
metadata:
  name: {{ .Values.model.name }}
  namespace: {{ .Values.namespaces.externalModels }}
spec:
  provider: openai
  endpoint: {{ .Values.model.endpoint }}
  auth:
    type: apikey
    secretRef:
      name: {{ .Values.model.name }}-api-key
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: {{ .Values.model.name }}
  namespace: {{ .Values.namespaces.externalModels }}
spec:
  # Client-facing model name: what users put in the "model" field of a request,
  # which the lab documents as gpt-oss-120b. targetModel is NOT valid here - it
  # belongs inside externalProviderRefs, and at the top level the API server
  # prunes it, which left admin/maas permanently OutOfSync.
  modelName: {{ .Values.model.name }}
  externalProviderRefs:
    - ref:
        name: {{ .Values.model.name }}
      apiFormat: {{ .Values.model.apiFormat }}
      path: {{ .Values.model.path }}
      targetModel: {{ .Values.model.name }}
      # Set explicitly because the operator defaults it, which otherwise leaves the
      # Application permanently OutOfSync even though the sync itself succeeded.
      weight: {{ .Values.model.weight }}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: {{ .Values.model.name }}
  namespace: {{ .Values.namespaces.externalModels }}
spec:
  modelRef:
    kind: ExternalModel
    name: {{ .Values.model.name }}
