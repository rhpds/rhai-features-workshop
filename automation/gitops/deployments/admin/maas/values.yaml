# Injected from bootstrap-infra (remotellm.*). The model is decided at staging
# time, so nothing is baked in here.
model:
  name: ""
  # Hostname only, no scheme and no path.
  endpoint: ""
  apiKey: ""
  apiFormat: openai-chat
  path: /v1/chat/completions
  # Traffic weight for the single provider. Must match what the operator defaults
  # to, or ArgoCD reports drift on every refresh.
  weight: 1
namespaces:
  externalModels: external-models
  aiTenants: ai-tenants
  tenant: models-as-a-service
gateway:
  name: maas-default-gateway
# Subscription tiers offered on the endpoint. These are what the user picks from
# in the "Generate API Key" dialog, so they must match the tier table in
# content/modules/ROOT/pages/02-inference/04-access-a-model-through-maas.adoc:
#
#   Free Tier     100 tokens / minute
#   Premium Tier  10,000 tokens / minute
#
# The migrated manifests only had a single "free" subscription of 10000 tokens
# per hour, so the lab asked users to choose a tier that did not exist.
subscriptions:
  - name: free
    displayName: Free Tier
    tokenLimit: 100
    window: 1m
    priority: 10
  - name: premium
    displayName: Premium Tier
    tokenLimit: 10000
    window: 1m
    priority: 20
# Repairs the usage-logs OpenTelemetryCollector that the maas-controller creates
# without spec.mode, which blocks the Loki usage pipeline and the usage
# dashboards. See templates/usage-logs-mode-patcher.yaml for the full writeup.
# Remove once RHOAI ships the collector with a mode set.
usageLogsPatcher:
  enabled: true
  # Bump to re-run the patch; the Job name carries it, so a new version supersedes
  # the old Job and ArgoCD prunes the previous one.
  version: 2
  image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
  # Where the RHOAI monitoring stack (and so the collector) lives. Matches
  # DSCI spec.monitoring.namespace.
  namespace: redhat-ods-monitoring
