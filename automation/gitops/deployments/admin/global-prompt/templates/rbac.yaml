---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt-seeder
  namespace: {{ .Values.namespace }}
---
# Grants the job SA access to the MLflow prompt registry.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: global-prompt-mlflow-integration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlflow-operator-mlflow-integration
subjects:
  - kind: ServiceAccount
    name: prompt-seeder
    namespace: {{ .Values.namespace }}
