username: user1
namespacePrefix: wksp

serverName: fed-aura-playground

# Remote LLM / MaaS provider, injected from agnosticv (bootstrap-infra remotellm.*).
remotellm:
  enabled: true
  url: ""
  id: ""
  apiToken: ""

pgvector:
  enabled: true
  image: registry.redhat.io/rhel9/postgresql-16
  database: vectordb
  user: vectoruser
  password: "pgvector123"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

embeddingModel: ibm-granite/granite-embedding-125m-english
embeddingDimension: 768

# RHOAI dashboard connection secret pointing at the OGX server (used by AutoRAG).
connection:
  enabled: true
  name: fed-aura-ogx-connection
  apiKey: "REPLACE_ME"

server:
  replicas: 1
  port: 8321
  resources:
    requests:
      cpu: 250m
      memory: 500Mi
    limits:
      cpu: "2"
      memory: 12Gi
