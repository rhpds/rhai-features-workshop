approval_checklist:
  content:
    prerequisites_verifiable: false
    assessment_strategy: 'Trust-based — no automated validation. Students confirm
      completion by observing expected results (model endpoints responding in GenAI
      Playground, AutoML results populating in RHOAI, MLflow traces appearing, guardrail
      blocks triggering). No automated solve/validate buttons or scoring.'
    design_overview: "This intermediate hands-on workshop places participants inside\
      \ Fed Aura Capital’s pre-deployed production AI platform on Red Hat OpenShift\
      \ AI, covering the full RHOAI portfolio across nine modules: model deployment\
      \ and GPU inference, MaaS governance, prompt engineering, AutoML, RAG, OGX agentic\
      \ routing, MCP tooling, MLflow tracing and evaluation, and AI safety with NeMo\
      \ Guardrails and OpenShell sandboxing. Each capability is introduced through\
      \ the lens of a real mortgage lending use case (the Lenora assistant at Fed Aura\
      \ Capital), making the platform decisions concrete and business-motivated."
    module_summaries:
    - title: Model Catalog and Deployment
      overview: Participants deploy the same LLM twice from the RHOAI Model Catalog
        — once on CPU and once with GPU acceleration via llm-d — then benchmark quantized
        vs. unquantized variants using TTFT metrics to understand inference trade-offs.
    - title: Models as a Service
      overview: Participants publish a deployed model as a governed MaaS endpoint
        with subscription tier rate limits, generate API keys, and consume the endpoint
        from a developer tool (OpenCode/VS Code).
    - title: GenAI Playground
      overview: Participants create a multi-model Playground session comparing responses
        across CPU-hosted and external models, then design and version a domain-specific
        system prompt for the Lenora assistant using the MLflow Prompt Registry.
    - title: Predictive AI with AutoML
      overview: Participants configure and launch an AutoML binary classification
        job against a mortgage loan dataset, analyze the model leaderboard, and interpret
        which features drive automated loan approval predictions.
    - title: RAG and AutoRAG
      overview: Participants observe RAG-grounded responses in the running Fed Aura
        app, then enable RAG in the Playground, upload a private policy document,
        and validate that retrieved responses are grounded in the document.
    - title: 'OGX: Unified Agentic API Surface'
      overview: Participants deploy OGX on RHOAI, redirect existing LangGraph agents
        through it with a single base_url change, and configure provider routing and
        failover between self-hosted and remote model endpoints.
    - title: MCP Ecosystem
      overview: Participants inspect MCPServerRegistration CRDs, verify the MCP gateway
        route in the gateway-system project, and invoke mortgage domain tools (affordability_calc,
        risk_assessment, pricing_engine) through GenAI Playground.
    - title: Evaluations and Tracing with MLflow
      overview: Participants trace agent decision paths end-to-end in MLflow including
        the AutoML model invocation, run an automated evaluation pipeline, and use
        EvalHub to compare system prompt versions by quality score.
    - title: AI Safety and Secure Agent Onboarding
      overview: Participants trigger input and output guardrail blocks, review Garak
        adversarial test results, deploy an agent into an OpenShell Agent Sandbox with
        deny-by-default policies, and examine OCSF-formatted audit logs.
