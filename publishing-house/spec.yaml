spec:
  title: 'Fed Aura Capital Workshop: AgentOps Observability with Red Hat OpenShift
    AI'
  learning_objectives:
  - Explore a production-pattern multi-agent AI application and identify the observability
    gap that conventional monitoring tools cannot close
  - "Monitor AI-specific metrics and KPIs \u2014 including LLM token usage, inference\
    \ latency, and tool-call success rates \u2014 using pre-deployed Grafana dashboards"
  - Analyze structured application logs for a multi-agent system using LokiStack and
    LogQL queries
  - Configure and use MLflow tracing to capture end-to-end agent execution spans,
    from input/output shields through LLM calls and tool invocations
  - Analyze agent traces to identify latency hotspots, failed tool calls, and multi-turn
    conversation context across user sessions
  - Deploy an automated evaluation pipeline and verify prompt regression detection
    using Red Hat OpenShift AI Data Science Pipelines and MLflow Prompt Registry (optional)
  modules:
  - id: module-01
    title: The Agentic App and Why Observability Matters
    duration_min: 25
    status: not_started
  - id: module-02
    title: Observability Pillars, Concepts, and Personas
    duration_min: 15
    status: not_started
  - id: module-03
