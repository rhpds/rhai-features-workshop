project:
  slug: rhai-features-workshop
  owner_email: rshah@redhat.com
  content_type: lab
  deployment_mode: rhdp_published
  initiative_key: none
  showroom_type: classic
  intake_type: migration
  automation_type: both
  description: Traditional AI demos show a model answering questions. Production AI
    requires a complete platform — model serving, governed access, domain grounding,
    tool integration, observability, evaluation, and security. This workshop takes
    you through the full Red Hat OpenShift AI product portfolio by putting you inside
    a real production deployment at Fed Aura Capital.
  jira_ticket: RHDPCD-1187
  workflow_id: d5fb7218-8b36-4d55-b2e8-080e7bde1d9a
spec:
  title: Red Hat OpenShift AI 3 Features Workshop
  learning_objectives:
  - Deploy an LLM from the RHOAI Model Catalog on CPU and with GPU acceleration using
    llm-d, and benchmark quantized vs. unquantized inference performance using TTFT
    metrics
  - Publish a deployed model as a governed MaaS endpoint with rate-limited API keys
    and consume it from a developer tool
  - Design and version domain-specific system prompts using the GenAI Playground and
    save them to the MLflow Prompt Registry
  - Configure and run an AutoML binary classification job to build a predictive loan
    underwriting model and interpret feature importance
  - Enable RAG-grounded responses by uploading a private policy document and validate
    that retrieved facts are grounded in the source
  - Deploy OGX as a unified agentic API surface and configure provider routing with
    failover between self-hosted and remote model providers
  - Inspect MCP server registrations and gateway routes, and invoke mortgage domain
    tools through GenAI Playground
  - Analyze MLflow traces to reconstruct agent decision paths, and run automated evaluation
    pipelines to measure agent quality across prompt versions
  - Configure NeMo Guardrails, deploy an agent into an OpenShell Agent Sandbox with
    deny-by-default policies, and review OCSF audit logs
  modules:
  - id: module-01
    title: Model Catalog and Deployment
    duration_min: 25
    status: not_started
  - id: module-02
    title: Models as a Service
    duration_min: 20
    status: not_started
  - id: module-03
    title: GenAI Playground
    duration_min: 20
    status: not_started
  - id: module-04
    title: Predictive AI with AutoML
    duration_min: 25
    status: not_started
  - id: module-05
    title: RAG and AutoRAG
    duration_min: 20
    status: not_started
  - id: module-06
    title: 'OGX: Unified Agentic API Surface'
    duration_min: 20
    status: not_started
  - id: module-07
    title: MCP Ecosystem
    duration_min: 25
    status: not_started
  - id: module-08
    title: Evaluations and Tracing with MLflow
    duration_min: 30
    status: not_started
  - id: module-09
    title: AI Safety and Secure Agent Onboarding
    duration_min: 30
    status: not_started
