---
# Antora playbook used by Showroom at runtime (ocp4_workload_showroom_content_antora_playbook).
# Keep the UI bundle, supplemental files and extension list identical to
# default-site.yml (the GitHub Pages playbook) so the rendered lab is the same
# in-cluster and on GitHub Pages. Only site.url differs between the two.
site:
  title: "Fed Aura Capital AI Workshop with Red Hat AI"
  url: https://rhpds.github.io/rhai-features-workshop
  start_page: modules::index.adoc

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/v2.0.3/ui-bundle.zip
    snapshot: true
  supplemental_files: ./content/supplemental-ui

runtime:
  fetch: true

antora:
  extensions:
    - require: '@antora/lunr-extension'
      index_latest_only: true

output:
  dir: ./www
